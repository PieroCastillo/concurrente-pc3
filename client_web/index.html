<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Web Medico - Diagnostico CNN Distribuido</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #1e293b; border-radius: 12px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { color: #38bdf8; text-align: center; margin-bottom: 8px; font-size: 1.8rem; }
        p.subtitle { text-align: center; color: #94a3b8; font-size: 0.95rem; margin-top: 0; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .card { background: #0f172a; border-radius: 8px; padding: 16px; border: 1px solid #334155; }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: #cbd5e1; font-size: 0.9rem; }
        input, select, button { width: 100%; box-sizing: border-box; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #1e293b; color: #fff; margin-bottom: 12px; }
        button { background: #0284c7; font-weight: bold; cursor: pointer; border: none; transition: background 0.2s; }
        button:hover { background: #0369a1; }
        canvas { background: #000; border-radius: 6px; display: block; margin: 0 auto 12px auto; cursor: crosshair; }
        .chat-box { height: 260px; overflow-y: auto; background: #020617; border-radius: 6px; padding: 12px; border: 1px solid #334155; font-size: 0.85rem; font-family: monospace; }
        .msg { margin-bottom: 10px; padding: 8px 10px; border-radius: 6px; }
        .msg-client { background: #0369a1; text-align: right; margin-left: 20%; }
        .msg-system { background: #1e293b; text-align: left; margin-right: 20%; border-left: 3px solid #38bdf8; }
        .badge-success { color: #4ade80; font-weight: bold; }
        .badge-danger { color: #f87171; font-weight: bold; }
        .tag { display: inline-block; padding: 2px 6px; background: #334155; border-radius: 4px; font-size: 0.75rem; margin-right: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sistema Medico Distribuido - CNN Chat</h1>
        <p class="subtitle">Micro Chunks CNN from Scratch | Middleware RabbitMQ | Bases de Datos Heterogéneas</p>
        
        <div class="grid">
            <!-- Panel Izquierdo: Simulación de Imagen y Parámetros -->
            <div class="card">
                <label>ID Cliente:</label>
                <input type="text" id="idCliente" value="CLI_WEB_01">

                <label>Token de Validación (BD2 MariaDB):</label>
                <input type="text" id="tokenAuth" value="TOKEN_WEB_PORTAL_3310">

                <label>Modelo CNN Destino:</label>
                <select id="modeloDestino">
                    <option value="MODELO_A">Modelo A: Chest X-Ray (Neumonía)</option>
                </select>

                <label>Patrón Radiológico (Dibujar o Generar):</label>
                <canvas id="xrayCanvas" width="140" height="140"></canvas>
                <div style="display:flex; gap: 8px;">
                    <button onclick="generarRx('normal')" style="background:#334155;">Rx Normal</button>
                    <button onclick="generarRx('neumonia')" style="background:#334155;">Rx Neumonía</button>
                    <button onclick="limpiarCanvas()" style="background:#475569;">Limpiar</button>
                </div>
                <button onclick="enviarDiagnostico()" style="background:#059669; margin-top: 10px;">Enviar Consulta al Backend</button>
            </div>

            <!-- Panel Derecho: Chat y Flujo de Nodos -->
            <div class="card">
                <label>Historial de Chat & Respuestas Distribuidas:</label>
                <div class="chat-box" id="chatHistory">
                    <div class="msg msg-system">
                        <b>Sistema:</b> Conectado con Servidor Web Nativo (Sockets HTTP). Listo para diagnosticar.
                    </div>
                </div>
                <div style="margin-top: 12px; font-size: 0.8rem; color: #94a3b8;">
                    <b>Ruta de procesamiento:</b><br>
                    <span class="tag">Cliente Web</span> &rarr;
                    <span class="tag">Backend TCP</span> &rarr;
                    <span class="tag">RabbitMQ</span> &rarr;
                    <span class="tag">BD2 C#</span> &rarr;
                    <span class="tag">CNN IA</span> &rarr;
                    <span class="tag">BD1 Postgres</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('xrayCanvas');
        const ctx = canvas.getContext('2d');
        let painting = false;

        function limpiarCanvas() {
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        limpiarCanvas();

        function generarRx(tipo) {
            limpiarCanvas();
            // Dibujar silueta de tórax
            ctx.fillStyle = '#222';
            ctx.beginPath();
            ctx.ellipse(70, 70, 50, 60, 0, 0, 2 * Math.PI);
            ctx.fill();

            if (tipo === 'neumonia') {
                // Mancha de opacidad lobar
                let grad = ctx.createRadialGradient(85, 65, 5, 85, 65, 30);
                grad.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
                grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(85, 65, 30, 0, 2 * Math.PI);
                ctx.fill();
            }
        }

        // Obtener matriz 28x28 en base64
        function obtenerImagenBase64() {
            // Escalar canvas a 28x28
            const smallCanvas = document.createElement('canvas');
            smallCanvas.width = 28;
            smallCanvas.height = 28;
            const smallCtx = smallCanvas.getContext('2d');
            smallCtx.drawImage(canvas, 0, 0, 28, 28);
            const imgData = smallCtx.getImageData(0, 0, 28, 28);
            
            // Convertir a bytes escala de grises
            const bytes = new Uint8Array(28 * 28);
            for (let i = 0; i < 28 * 28; i++) {
                const r = imgData.data[i * 4];
                const g = imgData.data[i * 4 + 1];
                const b = imgData.data[i * 4 + 2];
                bytes[i] = Math.floor(0.299 * r + 0.587 * g + 0.114 * b);
            }
            
            let binary = '';
            for (let i = 0; i < bytes.length; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return btoa(binary);
        }

        function appendMessage(sender, text, isClient) {
            const chat = document.getElementById('chatHistory');
            const div = document.createElement('div');
            div.className = isClient ? 'msg msg-client' : 'msg msg-system';
            div.innerHTML = `<b>${sender}:</b> ${text}`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        async function enviarDiagnostico() {
            const idCliente = document.getElementById('idCliente').value;
            const token = document.getElementById('tokenAuth').value;
            const modelo = document.getElementById('modeloDestino').value;
            const imgB64 = obtenerImagenBase64();

            appendMessage(idCliente, "Enviando radiografía de tórax para diagnóstico...", true);

            const payload = {
                idSolicitud: "REQ-WEB-" + Date.now(),
                idCliente: idCliente,
                token: token,
                tipoConsulta: "DIAGNOSTICO",
                modeloDestino: modelo,
                imagenB64: imgB64
            };

            try {
                const response = await fetch('/api/diagnosticar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const res = await response.json();

                if (res.error) {
                    appendMessage("Sistema", `<span class="badge-danger">Error:</span> ${res.error}`, false);
                } else {
                    const badgeClass = res.diagnostico === 'NORMAL' ? 'badge-success' : 'badge-danger';
                    appendMessage("CNN IA", `
                        Diagnóstico: <span class="${badgeClass}">${res.diagnostico}</span><br>
                        Confianza: <b>${(res.probabilidad * 100).toFixed(1)}%</b><br>
                        Tiempo IA: ${res.tiempo_ia_ms} ms | Nodo: ${res.nodo_ia}
                    `, false);
                }
            } catch (err) {
                appendMessage("Sistema", `<span class="badge-danger">Fallo de comunicación con backend:</span> ${err.message}`, false);
            }
        }
    </script>
</body>
</html>
